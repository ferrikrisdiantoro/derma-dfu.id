# DERMA-DFU.ID — Deployment via Traefik yang sudah ada di server.
# Container attach ke network 'n8n_default' (Traefik) — TIDAK buat network baru,
# TIDAK publish port ke host (routing sepenuhnya via Traefik).
# Domain: baca dari .env variable DOMAIN
# Pattern mengikuti landing/kone-crm yang sudah works.

services:
  derma-dfu-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: derma-dfu-web
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.dermadfu.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.dermadfu.tls=true
      - traefik.http.routers.dermadfu.entrypoints=web,websecure
      - traefik.http.routers.dermadfu.tls.certresolver=mytlschallenge
      - traefik.http.services.dermadfu.loadbalancer.server.port=80
    networks:
      - n8n_default
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  n8n_default:
    external: true
