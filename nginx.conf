# DERMA-DFU.ID — Nginx static server config
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

    # Cache untuk assets hash-versioned (Vite)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cache untuk model ONNX (48 MB — hemat bandwidth)
    location /models/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # WASM files (ORT runtime)
    location /ort/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin *;
        default_type application/wasm;
        try_files $uri =404;
    }

    # SPA fallback: semua route yang tidak match file -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny akses ke file sensitive
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Client body size (untuk upload foto luka)
    client_max_body_size 20M;
}
